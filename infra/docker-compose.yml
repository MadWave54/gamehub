# Локальная сборка: docker compose up --build (из папки infra)
volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend/
    env_file: ../.env
    volumes:
      - static:/backend_static
      - media:/app/media
      - ../data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend
