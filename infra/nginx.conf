server {
    listen 80;
    client_max_body_size 10M;
    server_tokens off;

    # REST API, админка и короткие ссылки проксируются в контейнер backend (Gunicorn)
    location ~ ^/(api|admin|s)/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Статика Django (админка, browsable API)
    location /static/ {
        alias /staticfiles/static/;
    }

    # Загруженные пользователями скриншоты и аватары
    location /media/ {
        alias /media/;
    }

    # Место для будущего SPA-клиента; пока — страница-заглушка
    location / {
        default_type text/plain;
        return 200 'GameHub API: /api/';
    }
}
