# Сервер: образы берутся из Docker Hub (их собирает и пушит GitHub Actions)
volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/gamehub_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
      - ../data:/app/data:ro
    depends_on:
      - db
    restart: always

  gateway:
    image: ${DOCKERHUB_USERNAME}/gamehub_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend
    restart: always
